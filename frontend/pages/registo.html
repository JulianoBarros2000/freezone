<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Cria a tua conta e começa a construir a tua carreira musical."
    />

    <meta name="theme-color" content="#121212" />

    <title>Criar conta — ONErpm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />

    <link rel="stylesheet" href="../assets/css/components.css" />

    <link rel="stylesheet" href="../assets/css/auth.css" />
  </head>

  <body class="auth-page">
    <div class="auth-background">
      <div class="auth-glow auth-glow-one"></div>

      <div class="auth-glow auth-glow-two"></div>

      <div class="auth-grid"></div>
    </div>

    <main class="auth-wrapper auth-register-page">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-11 col-md-9 col-lg-7">
            <!-- Logo -->

            <div class="auth-brand">
              <a href="../index.html" class="auth-logo">
                <span class="navbar-brand-mark">
                  <i class="bi bi-soundwave"></i>
                </span>

                ONErpm
              </a>
            </div>

            <div class="auth-card">
              <div class="auth-header">
                <span class="auth-eyebrow"> Começa agora </span>

                <h1>Cria a tua conta</h1>

                <p>
                  Junta-te à plataforma e dá o próximo passo na tua carreira.
                </p>
              </div>

              <div id="authAlert" class="auth-alert" role="alert"></div>

              <form id="registerForm" novalidate>
                <div class="row g-3">
                  <!-- Nome -->

                  <div class="col-md-6">
                    <div class="auth-field">
                      <label for="name" class="form-label">
                        Nome completo
                      </label>

                      <div class="input-wrapper">
                        <i class="bi bi-person"></i>

                        <input
                          type="text"
                          id="name"
                          name="name"
                          class="form-control"
                          placeholder="O teu nome"
                          autocomplete="name"
                          required
                        />
                      </div>

                      <div class="field-error" id="nameError"></div>
                    </div>
                  </div>

                  <!-- Artist -->

                  <div class="col-md-6">
                    <div class="auth-field">
                      <label for="artistName" class="form-label">
                        Nome artístico
                      </label>

                      <div class="input-wrapper">
                        <i class="bi bi-mic"></i>

                        <input
                          type="text"
                          id="artistName"
                          name="artistName"
                          class="form-control"
                          placeholder="Nome artístico"
                        />
                      </div>

                      <div class="field-error" id="artistNameError"></div>
                    </div>
                  </div>

                  <!-- Email -->

                  <div class="col-12">
                    <div class="auth-field">
                      <label for="registerEmail" class="form-label">
                        Email
                      </label>

                      <div class="input-wrapper">
                        <i class="bi bi-envelope"></i>

                        <input
                          type="email"
                          id="registerEmail"
                          name="email"
                          class="form-control"
                          placeholder="nome@exemplo.com"
                          autocomplete="email"
                          required
                        />
                      </div>

                      <div class="field-error" id="registerEmailError"></div>
                    </div>
                  </div>

                  <!-- Password -->

                  <div class="col-md-6">
                    <div class="auth-field">
                      <label for="registerPassword" class="form-label">
                        Palavra-passe
                      </label>

                      <div class="input-wrapper">
                        <i class="bi bi-lock"></i>

                        <input
                          type="password"
                          id="registerPassword"
                          name="password"
                          class="form-control"
                          placeholder="Mínimo 8 caracteres"
                          autocomplete="new-password"
                          required
                        />

                        <button
                          type="button"
                          class="password-toggle"
                          data-target="registerPassword"
                          aria-label="Mostrar palavra-passe"
                        >
                          <i class="bi bi-eye"></i>
                        </button>
                      </div>

                      <div class="password-strength" id="passwordStrength">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                      </div>

                      <small class="password-hint">
                        Use pelo menos 8 caracteres.
                      </small>

                      <div class="field-error" id="registerPasswordError"></div>
                    </div>
                  </div>

                  <!-- Confirm password -->

                  <div class="col-md-6">
                    <div class="auth-field">
                      <label for="confirmPassword" class="form-label">
                        Confirmar palavra-passe
                      </label>

                      <div class="input-wrapper">
                        <i class="bi bi-shield-lock"></i>

                        <input
                          type="password"
                          id="confirmPassword"
                          name="confirmPassword"
                          class="form-control"
                          placeholder="Repete a palavra-passe"
                          autocomplete="new-password"
                          required
                        />

                        <button
                          type="button"
                          class="password-toggle"
                          data-target="confirmPassword"
                          aria-label="Mostrar palavra-passe"
                        >
                          <i class="bi bi-eye"></i>
                        </button>
                      </div>

                      <div class="field-error" id="confirmPasswordError"></div>
                    </div>
                  </div>

                  <!-- Terms -->

                  <div class="col-12">
                    <label class="terms-option">
                      <input type="checkbox" id="terms" name="terms" required />

                      <span>
                        Concordo com os
                        <a href="#"> Termos de utilização </a>
                        e a
                        <a href="#"> Política de privacidade </a>.
                      </span>
                    </label>

                    <div class="field-error" id="termsError"></div>
                  </div>

                  <!-- Submit -->

                  <div class="col-12">
                    <button
                      type="submit"
                      class="btn btn-primary auth-submit"
                      id="registerButton"
                    >
                      <span class="button-text">
                        Criar a minha conta

                        <i class="bi bi-arrow-up-right"></i>
                      </span>

                      <span class="button-loading" hidden>
                        <span class="spinner-border spinner-border-sm"></span>

                        A criar conta...
                      </span>
                    </button>
                  </div>
                </div>
              </form>
              <div class="auth-divider">
                <span>ou registar com</span>
              </div>

              <div class="google-auth-wrapper">
                <div id="googleRegisterButton"></div>
              </div>

              <div class="auth-divider">
                <span> Já tens uma conta? </span>
              </div>

              <div class="auth-register">
                <a href="login.html"> Entrar na minha conta </a>
              </div>
            </div>

            <div class="auth-footer">
              <a href="../index.html">
                <i class="bi bi-arrow-left"></i>

                Voltar ao início
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/auth.js"></script>
  </body>
</html>
